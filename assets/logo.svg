<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121F38"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="line3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6EE7D7"/>
    </linearGradient>
    <linearGradient id="arc3" x1="0" y1="0.6" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#5EEAD4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg3)"/>

  <!-- 雷达弧：止于左上，不和终点亮点相撞 -->
  <path d="M 108 380 A 212 212 0 0 1 300 148"
        fill="none" stroke="url(#arc3)" stroke-width="17" stroke-linecap="round"/>

  <!-- 主视觉：上行折线 -->
  <polyline points="150,352 226,282 282,314 368,182"
            fill="none" stroke="url(#line3)" stroke-width="38"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 终点亮点 -->
  <circle cx="368" cy="182" r="44" fill="#5EEAD4" fill-opacity="0.18"/>
  <circle cx="368" cy="182" r="26" fill="#7FF3E0"/>
</svg>
